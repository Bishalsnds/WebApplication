<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Programme placeholder image</title>
  <desc id="desc">Default illustration shown when a programme image is not configured.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f2ec"/>
      <stop offset="100%" stop-color="#e6dfd3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#g)"/>
  <circle cx="290" cy="350" r="150" fill="#d6c9b2" opacity="0.55"/>
  <circle cx="905" cy="170" r="95" fill="#c8622a" opacity="0.12"/>
  <rect x="365" y="210" width="470" height="280" rx="20" fill="#ffffff" stroke="#ddd8cf" stroke-width="3"/>
  <text x="600" y="315" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="32" fill="#1a3044">Programme Image</text>
  <text x="600" y="360" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="20" fill="#7a7065">No custom image uploaded</text>
</svg>
