<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Student Course Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Student <span>Course Hub</span></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="programmes.html">Programmes</a>
      <a href="modules.html">Modules</a>
      <a href="student-dashboard.html">Dashboard</a>
      <a href="login.html" class="active">Login</a>
    </nav>
  </header>

  <main>
    <section class="hero" style="padding-bottom:1rem;">
      <div class="hero-label">Account Access</div>
      <h2>Sign <em>In</em></h2>
      <p>Enter your credentials to access your dashboard and manage your programme interests.</p>
    </section>

    <div class="form-wrapper">
      <form action="/auth/login" method="POST">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="jane@university.ac.uk" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <button type="submit">Login →</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Student Course Hub. All rights reserved.</p>
  </footer>
</body>
</html>
